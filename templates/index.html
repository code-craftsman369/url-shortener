<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL短縮サービス</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .result h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .short-url {
            background: white;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            word-break: break-all;
        }
        
        .short-url a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .copy-btn {
            margin-top: 10px;
            padding: 8px 16px;
            width: auto;
            background: #667eea;
        }
        
        .error {
            color: #f44336;
            margin-top: 10px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 URL短縮サービス</h1>
        <p class="subtitle">長いURLを短く、わかりやすく</p>
        
        <form id="shortenForm">
            <div class="form-group">
                <label for="url">短縮したいURL *</label>
                <input type="text" id="url" placeholder="https://example.com/very/long/url" required>
            </div>
            
            <div class="form-group">
                <label for="customCode">カスタムコード（オプション）</label>
                <input type="text" id="customCode" placeholder="my-link（3-20文字の英数字）">
            </div>
            
            <button type="submit">短縮URLを作成</button>
        </form>
        
        <div class="error" id="error"></div>
        
        <div class="result" id="result">
            <h3>✅ 短縮URLが作成されました！</h3>
            <div class="short-url">
                <strong>短縮URL:</strong><br>
                <a id="shortUrl" href="#" target="_blank"></a>
            </div>
            <button class="copy-btn" onclick="copyToClipboard()">📋 コピー</button>
        </div>
    </div>
    
    <script>
        document.getElementById('shortenForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const url = document.getElementById('url').value;
            const customCode = document.getElementById('customCode').value;
            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');
            
            errorDiv.classList.remove('show');
            resultDiv.classList.remove('show');
            
            try {
                const response = await fetch('/shorten', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: url,
                        custom_code: customCode || undefined
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('shortUrl').href = data.short_url;
                    document.getElementById('shortUrl').textContent = data.short_url;
                    resultDiv.classList.add('show');
                } else {
                    errorDiv.textContent = data.error;
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                errorDiv.textContent = 'エラーが発生しました';
                errorDiv.classList.add('show');
            }
        });
        
        function copyToClipboard() {
            const shortUrl = document.getElementById('shortUrl').textContent;
            navigator.clipboard.writeText(shortUrl);
            alert('クリップボードにコピーしました！');
        }
    </script>
</body>
</html>
